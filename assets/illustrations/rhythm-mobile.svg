<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-label="一天的节律：白天去户外，傍晚慢下来，夜间留给睡眠。非测量曲线。"><title>一天的节律：白天去户外，傍晚慢下来，夜间留给睡眠。非测量曲线。</title><rect width="320" height="340" rx="18" fill="#193c32"/><g font-family="system-ui,sans-serif"><text x="24" y="33" fill="#a9bdad" font-size="12" letter-spacing="2">MAKE ROOM FOR REST</text><path d="M61 78V275" stroke="#8fa990" stroke-dasharray="4 6"/><circle cx="61" cy="89" r="23" fill="#c6e98a"/><circle cx="61" cy="181" r="21" fill="#eccd91"/><path d="M58 248a25 25 0 1 0 24 34 27 27 0 0 1-24-34" fill="#edf2df"/><g fill="#edf2df" font-size="21"><text x="110" y="91">白天 · 去户外</text><text x="110" y="183">傍晚 · 慢下来</text><text x="110" y="275">夜间 · 好好睡</text></g><g fill="#a9bdad" font-size="14"><text x="110" y="117">给活动留时间</text><text x="110" y="209">降低光线与刺激</text><text x="110" y="301">留足睡眠的空间</text></g></g></svg>